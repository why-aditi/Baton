# Week-1 spike: one throwaway Forge app that answers all four Nov 23 go/no-go questions.
modules:
  jira:globalPage:
    - key: baton-spike-home
      resource: main
      resolver:
        function: resolver
      render: native # ponytail: UI Kit for the spike (no build step); real app uses Custom UI
      title: Baton spike

  function:
    - key: resolver
      handler: index.handler
    - key: list-handovers-fn
      handler: index.listHandovers

  rovo:agent:
    - key: baton-agent
      name: Baton
      description: Answers questions about team handovers.
      prompt: >
        You are Baton. Always call the list-handovers action before answering.
        Never invent handovers, items or owners.
      conversationStarters:
        - List open handovers
      actions:
        - list-handovers

  action:
    - key: list-handovers
      name: List handovers
      function: list-handovers-fn
      actionVerb: GET
      description: Lists the handovers the caller can see.
      inputs:
        status:
          title: Status
          type: string
          required: false
          description: Optional filter, one of draft, collecting, ready, published.

  rovo:mcp:
    - key: baton-mcp
      name: Baton handovers
      tools:
        - list-handovers

resources:
  - key: main
    path: src/frontend/index.jsx

permissions:
  scopes:
    - read:graph:user:atlassian
    - read:graph:team:atlassian
    - read:graph:issue:jira
    - read:graph:page:confluence
    - read:graph:pull-request:external
    - read:space:confluence
    - write:page:confluence
  external:
    fetch:
      backend:
        - address: api.groq.com

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/83b0292d-c06a-4bec-9e04-426a67cb0280
